name: Build ZenCord Mobile Bundle

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  build:
    name: Build Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm & Dependencies
        run: |
          npm install -g pnpm
          pnpm install

      - name: Build ZenCord Mobile Bundle
        run: |
          pnpm build --release-branch=${{ github.ref_name }} --build-minify

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zencord-mobile-dist
          path: dist/
          retention-days: 30

      - name: Commit & Push dist to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f dist/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(build): update bundle [skip ci]" && git push origin HEAD:${{ github.ref_name }})
