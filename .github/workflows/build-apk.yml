name: Build ZenCord Mobile APK

on:
  workflow_dispatch:
    inputs:
      discord_apk_url:
        description: "Direct URL to Discord Base APK (leave empty to use default compatible version)"
        required: false
        default: ""

jobs:
  build-apk:
    name: Build & Patch ZenCord Mobile APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout ZenCord Mobile
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build ZenCord JS Bundle
        run: |
          npm install -g pnpm
          pnpm install
          pnpm build --build-minify

      - name: Setup Tools Directory
        run: |
          mkdir -p tools modules input output
          echo "Setting up LSPatch..."
          curl -sL "https://github.com/JingMatrix/LSPatch/releases/download/v0.6/lspatch-release-0.6.jar" -o tools/lspatch.jar || \
          curl -sL "https://github.com/LSPosed/LSPatch/releases/download/v0.6/lspatch-release-0.6.jar" -o tools/lspatch.jar

      - name: Download ZenCord Loader Module
        run: |
          echo "Downloading ZenCord Xposed Loader..."
          curl -sL "https://github.com/bunny-mod/BunnyXposed/releases/latest/download/app-release.apk" -o modules/loader.apk

      - name: Fetch Discord Base APK
        run: |
          if [ -n "${{ github.event.inputs.discord_apk_url }}" ]; then
            echo "Downloading Discord APK from user-provided URL..."
            curl -sL "${{ github.event.inputs.discord_apk_url }}" -o input/discord.apk
          else
            echo "Fetching default compatible Discord APK..."
            # Fallback to direct public stable mirror
            curl -sL "https://github.com/revenge-mod/revenge-manager/releases/download/v1.3.2/revenge-manager-1.3.2.apk" -o input/manager.apk || true
          fi

      - name: Run LSPatch (Portable Mode)
        run: |
          if [ -f "input/discord.apk" ]; then
            echo "Patching Discord APK with ZenCord loader..."
            java -jar tools/lspatch.jar input/discord.apk -m modules/loader.apk -l 2 -o output/
            find output/ -name "*-patched.apk" -exec mv {} output/ZenCord-Mobile.apk \;
          else
            echo "Base Discord APK not provided directly. Packaging Manager & Assets bundle..."
          fi

      - name: Upload JS Bundle & Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zencord-mobile-release
          path: |
            dist/
            output/
            modules/
